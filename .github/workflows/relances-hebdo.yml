name: Relances de la semaine

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const due = [];
            for (const i of issues) {
              if (i.pull_request) continue;
              const m = (i.body || '').match(/Date de relance[^\n]*\n+\s*(\d{4}-\d{2}-\d{2})/);
              if (m && m[1] <= today) due.push(`- [ ] #${i.number} ${i.title} (relance prévue le ${m[1]})`);
            }
            if (!due.length) return core.info('Aucune relance due.');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Relances de la semaine (${today})`,
              body: `Contacts à relancer :\n\n${due.join('\n')}`,
              labels: ['relance'],
            });
