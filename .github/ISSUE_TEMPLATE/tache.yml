name: Tâche
description: Une action à mener par un pôle
body:
  - type: dropdown
    id: pole
    attributes:
      label: Pôle
      options: [Bureau, Terrain / guides, Partenaires, Com, Événement, Trésorerie]
    validations:
      required: true
  - type: input
    id: echeance
    attributes:
      label: "Échéance (AAAA-MM-JJ)"
  - type: textarea
    id: detail
    attributes:
      label: Détail
