name: Contact guide
description: Suivi d'une agence ou d'un guide de haute montagne
title: "[Guide] "
labels: ["contact-guide", "terrain-guides"]
body:
  - type: markdown
    attributes:
      value: "⚠️ Repo public : pas de téléphone ni d'e-mail personnel ici. Les coordonnées restent dans la boîte mail Alpinis'EM."
  - type: input
    id: agence
    attributes:
      label: Agence / compagnie
    validations:
      required: true
  - type: dropdown
    id: statut
    attributes:
      label: Statut
      options: [À contacter, Contacté, Devis reçu, Négociation, Retenu, Écarté]
    validations:
      required: true
  - type: input
    id: date-contact
    attributes:
      label: Date du dernier contact (AAAA-MM-JJ)
  - type: input
    id: relance
    attributes:
      label: "Date de relance (AAAA-MM-JJ)"
      description: Utilisée par le récap hebdo des relances.
  - type: input
    id: tarif
    attributes:
      label: Tarif proposé
  - type: textarea
    id: notes
    attributes:
      label: Disponibilités et notes
